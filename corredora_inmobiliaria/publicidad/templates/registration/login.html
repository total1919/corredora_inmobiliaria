{% extends 'base.html' %}

{% block content %}

  <h2>Ingresar</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
    <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
  </form>

{% endblock %}
