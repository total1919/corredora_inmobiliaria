{% extends 'base.html' %}

{% block content %}

  <h2>Mi cuenta</h2>

  <form method="post">
    {% csrf_token %}
    <p><strong>Usuario:</strong> {{ user.username }}</p>
    <p><strong>Miembro desde:</strong> {{ user.date_joined|date:"d-m-Y" }}</p>
    {{ form.as_p }}
    <button type="submit">Guardar cambios</button>
    <p><a href="{% url 'password_change' %}">Cambiar contraseña</a></p>
  </form>

{% endblock %}
